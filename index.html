<html>

<head>
  <script src="index.js" type="module"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #222;
      font-family: sans-serif;
    }
    #wrap {
      position: relative;
      max-width: 100vw;
      max-height: 100vh;
    }
    #canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }
    #win {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      color: white;
      gap: 16px;
    }
    #win.show { display: flex; }
    #win h1 { margin: 0; font-size: 2em; }
    #win button {
      font-size: 1.2em;
      padding: 8px 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="wrap">
    <canvas id="canvas"></canvas>
    <div id="win">
      <h1>🎉 You won! 🎉</h1>
      <button id="restart">Play again</button>
    </div>
  </div>
</body>

</html>

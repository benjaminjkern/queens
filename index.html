<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script src="index.js" type="module"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #222;
      font-family: sans-serif;
      gap: 12px;
    }
    #controls {
      display: flex;
      align-items: center;
      gap: 20px;
      color: white;
      font-size: 1.2em;
      flex-wrap: wrap;
      justify-content: center;
    }
    #timer {
      font-size: 1.5em;
      font-variant-numeric: tabular-nums;
      min-width: 4ch;
      text-align: center;
    }
    #controls select, #controls button {
      font-size: 1em;
      padding: 4px 12px;
      cursor: pointer;
    }
    #controls label { display: inline-flex; align-items: center; gap: 6px; }
    #pauseOverlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      color: white;
      gap: 16px;
    }
    #pauseOverlay.show { display: flex; }
    #pauseOverlay h1 { margin: 0; font-size: 2em; }
    #pauseOverlay button {
      font-size: 1.2em;
      padding: 8px 20px;
      cursor: pointer;
    }
    #loadingOverlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.7);
      color: white;
      gap: 16px;
      z-index: 10;
    }
    #loadingOverlay.show { display: flex; }
    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #wrap {
      position: relative;
      max-width: 100vw;
      max-height: 100vh;
    }
    #canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #win {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      color: white;
      gap: 12px;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    #win.show { display: flex; }
    #win h1 { margin: 0; font-size: 2em; }
    #win .win-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    #win button, #win a.linklike {
      font-size: 1em;
      padding: 8px 16px;
      cursor: pointer;
      border: 1px solid white;
      background: transparent;
      color: white;
      border-radius: 4px;
      text-decoration: none;
      display: inline-block;
    }
    #win .pb-badge {
      background: gold;
      color: #222;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: bold;
      display: none;
    }
    #win .pb-badge.show { display: inline-block; }
    #win .final-time { font-size: 1.4em; font-variant-numeric: tabular-nums; }
    #recentOverlay {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      color: white;
      z-index: 20;
      padding: 20px;
      box-sizing: border-box;
    }
    #recentOverlay.show { display: flex; }
    #recentOverlay h1 { margin: 0 0 16px; font-size: 1.5em; }
    #recentList {
      width: 100%;
      max-width: 480px;
      max-height: 60vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .recent-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #333;
      border-radius: 6px;
      cursor: pointer;
      gap: 12px;
    }
    .recent-item:hover { background: #444; }
    .recent-item .meta { color: #bbb; font-size: 0.9em; }
    .recent-item .best { font-variant-numeric: tabular-nums; font-weight: bold; }
    #recentOverlay .empty { color: #888; font-style: italic; }
    #recentOverlay .close {
      margin-top: 16px;
      font-size: 1em;
      padding: 6px 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="controls">
    <span id="timer">0:00</span>
    <label>Size: <select id="size"></select></label>
    <button id="pause">Pause</button>
    <button id="newGame">New Game</button>
    <button id="recent">Recent</button>
  </div>
  <div id="wrap">
    <canvas id="canvas"></canvas>
    <div id="loadingOverlay">
      <div class="spinner"></div>
      <div>Generating board…</div>
    </div>
    <div id="pauseOverlay">
      <h1>⏸ Paused</h1>
      <button id="resume">Resume</button>
    </div>
    <div id="win">
      <h1>🎉 You won! 🎉</h1>
      <div class="final-time" id="finalTime"></div>
      <div class="pb-badge" id="pbBadge">⭐ New personal best!</div>
      <div class="win-buttons">
        <button id="restart">New game</button>
        <button id="replay">Replay this board</button>
        <button id="share">Copy share link</button>
      </div>
    </div>
  </div>
  <div id="recentOverlay">
    <h1>Recent boards</h1>
    <div id="recentList"></div>
    <button class="close" id="recentClose">Close</button>
  </div>
</body>

</html>
